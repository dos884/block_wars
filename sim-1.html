<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bcd6e8; --ink:#22303b; --btn:#f7fafc; --panel:rgba(247,250,252,.82);
  --muted:#5a6b78; --cmd:#ff7a1a; --brk:#e0453a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#17212b; --ink:#e6edf3; --btn:#26323d; --panel:rgba(38,50,61,.82); --muted:#9fb0bd;
  }
}
:root[data-theme="dark"]{
  --sky:#17212b; --ink:#e6edf3; --btn:#26323d; --panel:rgba(38,50,61,.82); --muted:#9fb0bd;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{
  position:fixed;top:0;left:0;right:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
}
.chip{
  pointer-events:auto;background:var(--panel);border:2px solid var(--ink);border-radius:12px;
  padding:6px 10px;font-size:13px;line-height:1.35;font-weight:600;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.chip b{font-weight:800}
.chip .sub{color:var(--muted)}
#status{color:var(--brk);font-weight:800;min-height:1.35em}

#controls{
  position:fixed;left:0;right:0;bottom:0;pointer-events:none;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
}
.btn{
  pointer-events:auto;appearance:none;-webkit-appearance:none;
  border:2px solid var(--ink);background:var(--btn);color:var(--ink);
  font:inherit;font-weight:800;font-size:15px;border-radius:14px;
  box-shadow:0 4px 0 var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  cursor:pointer;padding:0;transition:transform .05s,box-shadow .05s;
}
.btn.pressed{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--cmd);outline-offset:2px}
.btn:disabled{opacity:.45}

.pad{display:flex;flex-direction:column;align-items:center;gap:10px}
.dpad{display:grid;grid-template-columns:44px 80px 44px;grid-template-rows:44px 82px 44px;gap:5px}
.dpad .btn{font-size:20px}
.dpad [data-act="w"]{grid-column:2;grid-row:1}
.dpad [data-act="a"]{grid-column:1;grid-row:2}
.dpad [data-act="d"]{grid-column:3;grid-row:2}
.dpad [data-act="s"]{grid-column:2;grid-row:3}
.dpad .vstack{grid-column:2;grid-row:2;display:grid;grid-template-rows:1fr 1fr;gap:4px}
.dpad .vt{font-size:14px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.dpad .vt.pressed{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.dpad .vt.on{background:var(--cmd);color:#22303b}

.acts{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:min(46vw,190px)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw{height:40px;border-radius:10px}
.sw.sel{outline:3px solid var(--cmd);outline-offset:2px}
.aim{height:44px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{height:60px;font-size:16px}
.place{background:var(--cmd);color:#22303b}
.break{background:var(--brk);color:#fff}

@media (prefers-reduced-motion:reduce){.btn{transition:none}}
:root{--sel:#ff7a1a}
.chip.left{position:relative}
.ubtn{padding:4px 10px;font-size:14px;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
#unitsPanel{position:absolute;top:calc(100% + 6px);left:0;display:flex;flex-direction:column;gap:6px;min-width:180px;z-index:5}
#unitsPanel[hidden]{display:none}
.urow{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:15px;box-shadow:0 3px 0 var(--ink);text-align:left;justify-content:flex-start}
.urow .sub{margin-left:auto;font-size:12px}
.urow.cur{outline:3px solid var(--cmd);outline-offset:1px}
#controls .acts{flex:1;min-width:0;max-width:230px;align-items:stretch;margin-left:auto}
.confirm{height:60px;min-width:0;font-size:18px;background:var(--cmd);color:#22303b}
.dig{height:46px;min-width:0;font-size:15px}
#layers{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:30%;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:4}
.lb{width:54px;height:46px;font-size:18px}
.lb.auto{font-size:13px}
.lb.auto.on{background:var(--cmd);color:#22303b}
#layerTxt{font-size:12px;padding:4px 6px;text-align:center;min-width:54px;font-weight:800}
.unitswrap{position:relative;pointer-events:auto;align-self:flex-end;display:flex;flex-direction:column;align-items:stretch;gap:8px;width:112px;flex:none}
.nextbtn{height:48px;min-width:0;font-size:16px;padding:0 10px}
.unitsbig{height:56px;min-width:0;font-size:17px;padding:0 10px}
#unitsPanel{top:auto;bottom:calc(100% + 10px)}
#buildPanel{position:absolute;bottom:calc(100% + 10px);left:0;display:flex;flex-direction:column;gap:6px;min-width:210px;z-index:5}
#buildPanel[hidden]{display:none}
#winView{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:16px}
#winView[hidden]{display:none}
#winText{font-size:34px;font-weight:800}
.dig.on{background:var(--brk);color:#fff}
.endturn{height:42px;min-width:0;font-size:15px}
.undorow{display:flex;align-items:center;gap:6px}
.undorow .btn{height:40px;flex:1;font-size:13px;min-width:0;padding:0 4px;white-space:nowrap}
#acount{font-size:11px;font-weight:800;flex:none;text-align:center;padding:4px 5px;white-space:nowrap}
.stick{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;
  border:2px solid var(--ink);background:var(--panel);touch-action:none;z-index:6;opacity:.6}
.stick.live{opacity:.9}
.stick .knob{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--cmd);border:2px solid var(--ink);left:39px;top:39px;pointer-events:none}
#stickMove{left:calc(22px + env(safe-area-inset-left,0px))}
#stickLook{right:calc(22px + env(safe-area-inset-right,0px))}
#cmdExit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;padding:6px 12px;font-size:14px;z-index:6}
body.commander #hud, body.commander #controls, body.commander #layers{display:none}
body:not(.commander) .cmdui{display:none}
#shotBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;padding:6px 14px;font-size:14px;z-index:6}
#shotFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .25s}
#shotView{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff;font-weight:800;text-align:center}
#shotView[hidden]{display:none}
#shotView img{max-width:100%;max-height:72vh;border-radius:10px;border:2px solid #fff}
</style>
</head>
<body>
<canvas id="c" aria-label="3D world view. Tap a blue tile to move the selected unit. Swipe to rotate the camera, pinch to zoom."></canvas>

<div id="hud">
  <div class="chip left">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span class="dot" id="udot"></span><b id="uname">Unit</b></div>
    <div class="sub"><span id="ustate">Ready</span> · <span id="pos"></span></div>
    <div class="sub">Turn <b id="turn">1</b> · Wood <b id="invwood">0</b></div>
    <div class="sub">Gold <b id="gold">0</b> <span id="income"></span></div>
    <div id="status"></div>
  </div>
  <div class="chip" style="text-align:right">
    <div class="sub">State hash</div>
    <div><b id="hash">--------</b></div>
    <button class="btn" id="reset" style="margin-top:6px;padding:4px 10px;font-size:13px;box-shadow:0 3px 0 var(--ink)">Reset</button>
    <button class="btn" data-act="view" aria-pressed="false" style="margin-top:6px;padding:4px 10px;font-size:13px;box-shadow:0 3px 0 var(--ink);display:block;margin-left:auto">1st person</button>
    <button class="btn" data-act="commander" style="margin-top:6px;padding:4px 10px;font-size:13px;box-shadow:0 3px 0 var(--ink);display:block;margin-left:auto">Commander</button>
  </div>
</div>


<div id="layers" role="group" aria-label="View layer">
  <button class="btn lb" data-act="layerUp" aria-label="Show one layer higher">▲</button>
  <div id="layerTxt" class="chip">All</div>
  <button class="btn lb" data-act="layerDown" aria-label="Show one layer lower">▼</button>
  <button class="btn lb auto on" data-act="layerAuto" aria-pressed="true">Auto</button>
</div>

<div class="cmdui stick" id="stickMove" role="application" aria-label="Fly: drag to move"><div class="knob"></div></div>
<div class="cmdui stick" id="stickLook" role="application" aria-label="Look: drag to turn"><div class="knob"></div></div>
<button class="cmdui btn" id="cmdExit" data-act="commander">Exit commander</button>
<button class="cmdui btn" id="shotBtn" aria-label="Take a screenshot">📷 Screenshot</button>
<div id="shotFlash" aria-hidden="true"></div>
<div id="shotView" hidden>
  <div>Long-press the picture to save it</div>
  <img id="shotImg" alt="Screenshot of the game view">
  <button class="btn" id="shotClose" style="padding:8px 18px;color:var(--ink)">Close</button>
</div>

<div id="winView" hidden>
  <div id="winText">Blue wins!</div>
  <div class="sub" style="color:#fff">The enemy base has been captured.</div>
  <div style="display:flex;gap:10px">
    <button class="btn" id="winUndo" style="padding:10px 18px">↶ Undo</button>
    <button class="btn" id="winAgain" style="padding:10px 18px;background:var(--cmd);color:#22303b">Play again</button>
  </div>
</div>

<div id="controls">
  <div class="unitswrap">
    <div id="unitsPanel" hidden></div>
    <div id="buildPanel" hidden></div>
    <button class="btn nextbtn" id="buildBtn" aria-haspopup="true" aria-expanded="false" aria-controls="buildPanel">Build ▴</button>
    <button class="btn unitsbig" id="unitsBtn" aria-haspopup="true" aria-expanded="false" aria-controls="unitsPanel">Units ▴</button>
    <button class="btn nextbtn" data-act="next" aria-label="Select the next unit that hasn't moved">Next ▸</button>
  </div>
  <div class="acts">
    <div class="undorow">
      <button class="btn" data-act="undo" aria-label="Undo last action">↶ Undo</button>
      <span id="acount" class="chip">0 actions</span>
      <button class="btn" data-act="redo" aria-label="Redo">Redo ↷</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn dig" data-act="attack" aria-pressed="false" style="min-width:0;flex:1">Attack</button>
      <button class="btn dig" data-act="dig" aria-pressed="false" style="min-width:0;flex:1">Dig</button>
      <button class="btn dig" data-act="capture" style="min-width:0;flex:1">Capture</button>
    </div>
    <button class="btn confirm" data-act="confirm">Confirm move</button>
    <button class="btn endturn" data-act="endturn">End turn</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* =========================================================
   SIM — deterministic, integer-only. Units live on grid cells.
   Each turn a unit can move to any cell in its move range, once.
   (Walking inside the range is a client-side visual; only the confirmed cell is real.)
   ========================================================= */
const W = 96, D = 96, H = 40;                  // the bases are ~5 turns apart at 6 tiles per turn
const WD = W * D, N = W * D * H;
const AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, WOOD = 4, BEDROCK = 5, LEAVES = 6;
const SEED = 1;

const idx = (x, y, z) => x + z * W + y * WD;
const inGrid = (x, y, z) => x >= 0 && x < W && z >= 0 && z < D && y >= 0 && y < H;

function mix(a) {
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  return (a ^ (a >>> 16)) >>> 0;
}
const rnd = (a, b, c) => mix(Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791));

function generate(seed, w) {
  const g = new Uint8Array(N);
  const S = 14;                                 // hill size
  const heights = new Int32Array(WD);
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const ix = (x / S) | 0, iz = (z / S) | 0, fx = x % S, fz = z % S;
    const a = rnd(ix, iz, seed) % 7, b = rnd(ix + 1, iz, seed) % 7;
    const c = rnd(ix, iz + 1, seed) % 7, d = rnd(ix + 1, iz + 1, seed) % 7;
    const h = ((a * (S - fx) * (S - fz) + b * fx * (S - fz) + c * (S - fx) * fz + d * fx * fz) / (S * S)) | 0;
    const top = 28 + h;                         // surface at 28..34: ~30 layers of underground to dig
    heights[x + z * W] = top;
    for (let y = 0; y < top; y++) {
      g[idx(x, y, z)] = y === 0 ? BEDROCK : y < top - 3 ? STONE : y < top - 1 ? DIRT : GRASS;
    }
  }
  // Demo bridge near spawn: a wood deck on 4 wood pillars, gaps of 4 (wood reach 3 holds up to 6).
  // Break an inner pillar and the gap becomes 9, so the middle of that span crumbles.
  const BZ = (D >> 1) + 16, BX0 = (W >> 1) - 16, BX1 = BX0 + 30, PILLARS = [0, 5, 10, 15, 20, 25, 30].map(k => BX0 + k);
  let maxH = 0;
  for (let x = BX0; x <= BX1; x++) maxH = Math.max(maxH, heights[x + BZ * W]);
  const deckY = maxH + 3;
  for (const px of PILLARS) for (let y = heights[px + BZ * W]; y <= deckY; y++) g[idx(px, y, BZ)] = WOOD;
  for (let x = BX0; x <= BX1; x++) g[idx(x, deckY, BZ)] = WOOD;

  // Demo reservoir north of spawn: a stone basin raised on the hill, full of water,
  // with a wooden dam on its south wall and a stone staircase (spillway) leading down from it.
  const cx = W >> 1, cz = D >> 1;
  const LX0 = cx - 10, LX1 = cx + 10, LZ0 = cz - 32, LZ1 = cz - 20;         // water inside
  let top = 0;
  for (let z = LZ0 - 1; z <= LZ1 + 1; z++) for (let x = LX0 - 1; x <= LX1 + 1; x++) top = Math.max(top, heights[x + z * W]);
  const F = Math.min(top + 1, H - 8);                                        // lake floor (first water layer)
  const RIM = F + 5, WATER_TOP = F + 3;                                       // rim top, top water layer
  for (let z = LZ0 - 1; z <= LZ1 + 1; z++) for (let x = LX0 - 1; x <= LX1 + 1; x++) {
    const inside = x >= LX0 && x <= LX1 && z >= LZ0 && z <= LZ1;
    for (let y = 1; y < H; y++) {
      const i = idx(x, y, z);
      if (y < F) { if (!g[i]) g[i] = STONE; }
      else if (inside) { g[i] = AIR; if (y <= WATER_TOP) w[i] = WFULL; }
      else if (y <= RIM) g[i] = STONE;
    }
  }
  const DZ = LZ1 + 1;                                                        // dam: the middle of the south wall, in wood
  for (let x = cx - 6; x <= cx + 6; x++) for (let y = F; y <= RIM; y++) g[idx(x, y, DZ)] = WOOD;
  for (let k = 0; k < 30; k++) {                                             // apron at lake-floor level, then steps down
    const z = DZ + 1 + k, sy = k < 2 ? F - 1 : F - 1 - (k - 1);
    if (z >= D - 1) break;
    let any = false;
    for (let x = cx - 6; x <= cx + 6; x++) {
      if (sy < heights[x + z * W]) continue;
      any = true;
      for (let y = 1; y <= sy; y++) if (!g[idx(x, y, z)]) g[idx(x, y, z)] = STONE;
    }
    if (!any) break;
  }

  // Trees: trunks of wood with a leaf canopy — good for testing collapses.
  let placed = 0, tries = 0;
  const trunks = [];
  while (placed < 40 && tries < 3000) {
    tries++;
    const r = rnd(tries, placed, seed + 99);
    const x = 2 + (r % (W - 4)), z = 2 + ((r >>> 8) % (D - 4));
    if (UNIT_SPAWNS.some(([, ux, uz]) => Math.abs(ux - x) <= 2 && Math.abs(uz - z) <= 2)) continue;   // keep spawns clear
    if (BUILDING_SPOTS.some(([bx, bz]) => Math.abs(bx - x) <= 2 && Math.abs(bz - z) <= 2)) continue;   // keep buildings clear
    if (trunks.some(([tx, tz]) => Math.max(Math.abs(tx - x), Math.abs(tz - z)) < 4)) continue; // canopies must not touch
    if (Math.abs(z - BZ) <= 2 && x >= BX0 - 2 && x <= BX1 + 2) continue;                        // keep clear of the bridge
    if (x >= cx - 14 && x <= cx + 14 && z >= LZ0 - 4 && z <= cz - 2) continue;                   // keep clear of the reservoir
    trunks.push([x, z]);
    const base = heights[x + z * W];
    for (let t = 0; t < 3; t++) g[idx(x, base + t, z)] = WOOD;
    const leaf = (X, Y, Z) => { if (inGrid(X, Y, Z) && g[idx(X, Y, Z)] === AIR) g[idx(X, Y, Z)] = LEAVES; };
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      leaf(x + dx, base + 2, z + dz);
      leaf(x + dx, base + 3, z + dz);
    }
    leaf(x, base + 4, z); leaf(x + 1, base + 4, z); leaf(x - 1, base + 4, z);
    leaf(x, base + 4, z + 1); leaf(x, base + 4, z - 1);
    placed++;
  }
  return g;
}

const TEAM_NAMES = ['Blue', 'Red'];
const TEAM_COLORS = [0x3b82c4, 0xe0453a];
const MAX_HP = 10;

/* ---------- Unit types: one table, so they're easy to tune (and later, to mod) ---------- */
const TYPES = ['soldier', 'spearman', 'knight', 'archer', 'builder'];
const UNIT_TYPES = {
  soldier:  { label: 'Soldier',  move: 6, cost: 100, dig: 'soft', capture: true },
  spearman: { label: 'Spearman', move: 6, cost: 150, dig: 'soft', capture: true },
  knight:   { label: 'Knight',   move: 10, cost: 300, dig: 'none', capture: false, noClimb: true, tall: true },
  archer:   { label: 'Archer',   move: 6, cost: 200, dig: 'soft', capture: true, ranged: true },
  builder:  { label: 'Builder',  move: 6, cost: 150, dig: 'hard', capture: true },
};
// Base damage (out of 10 HP) by attacker row and defender column, before scaling by the attacker's health.
// Soldier beats spearman, spearman beats knight, knight beats soldier.
const DAMAGE = {
  //          soldier spearman knight archer builder
  soldier:  { soldier: 5, spearman: 7, knight: 3, archer: 6, builder: 7 },
  spearman: { soldier: 3, spearman: 5, knight: 7, archer: 6, builder: 7 },
  knight:   { soldier: 7, spearman: 3, knight: 5, archer: 8, builder: 8 },
  archer:   { soldier: 4, spearman: 4, knight: 3, archer: 5, builder: 6 },
  builder:  { soldier: 2, spearman: 2, knight: 1, archer: 2, builder: 3 },
};
const SOFT = [0, 1, 1, 0, 1, 0, 1];             // grass, dirt, wood, leaves: infantry can dig these
const unitName = u => UNIT_TYPES[u.type].label + ' ' + (u.id + 1);

/* ---------- Buildings: villages give gold, each team's base builds units; capturing the enemy base wins ---------- */
const CAPTURE_PTS = 20, INCOME = 100, START_GOLD = 300;
const BASE_X = 20;                               // bases sit 20 tiles either side of the centre: 40 apart
const VILLAGE_OFFSETS = [[14, 4], [28, -20], [8, 28], [32, 24]];     // mirrored left/right: 8 villages
const BUILDING_SPOTS = (() => {                 // [x, z, kind, owner]
  const cx = W >> 1, cz = D >> 1, out = [[cx - BASE_X, cz, 'base', 0], [cx + BASE_X, cz, 'base', 1]];
  for (const [d, dz] of VILLAGE_OFFSETS) out.push([cx - d, cz + dz, 'village', -1], [cx + d, cz + dz, 'village', -1]);
  return out;
})();
const DROWN_LEVEL = 48, DROWN_DMG = 2;           // deep water: 3/4 of a block or more
const SPAWN_OFFSET = 16;                        // each army starts just in front of its base
// Starting soldiers: each army stands just in front of its own base (mirrored).
const UNIT_SPAWNS = (() => {
  const cx = W >> 1, cz = D >> 1, out = [];
  for (const d of [-2, 0, 2]) out.push([0, cx - SPAWN_OFFSET, cz + d]);
  for (const d of [-2, 0, 2]) out.push([1, cx + SPAWN_OFFSET, cz + d]);
  return out;
})();
function groundY(g, x, z) { let y = 0; while (y < H && g[idx(x, y, z)]) y++; return y; }

// Every block change goes through setCell, which keeps three things up to date:
// the incremental block hash, the list of changed cells (for redrawing), and the region to re-check for support.
const zob = (i, v) => v ? mix(Math.imul(i, 8) + v) : 0;

/* ---------- Ghost-aware picking and tap snapping ---------- */
const pickV = new THREE.Vector3(), pickS = new THREE.Vector2();

  pickV.copy(p).applyMatrix4(camera.matrixWorldInverse);
  if (-pickV.z >= ghost.uUnitDepth.value - 0.7) return false;
  renderer.getDrawingBufferSize(pickS);
  pickV.copy(p).project(camera);
  const px = (pickV.x * 0.5 + 0.5) * pickS.x, py = (pickV.y * 0.5 + 0.5) * pickS.y;
  return Math.hypot(px - ghost.uUnitPx.value.x, py - ghost.uUnitPx.value.y) < ghost.uRadiusPx.value * 0.85;

// Can the camera see this point? (A block in the way counts, unless it's see-through.)

  raycaster.far = len - 0.05;
  const hits = raycaster.intersectObjects(chunkMeshes, false);
  raycaster.far = Infinity;
  for (const h of hits) if (!isGhosted(h.point)) return false;
  return true;
}
// A tap that missed: snap to the nearest visible blue tile within a fingertip of it, else nothing.
const SNAP_PX = 44;
function snapTile(cx, cy) {

    const [x, y, z] = k.split(',').map(Number);
    v.set(x + 0.5, y + 0.05, z + 0.5).project(camera);
    if (v.z > 1) continue;
    const sx = r.left + (v.x * 0.5 + 0.5) * r.width, sy = r.top + (-v.y * 0.5 + 0.5) * r.height;
    const d = Math.hypot(sx - cx, sy - cy);
    if (d <= SNAP_PX) cands.push([d, x, y, z]);

  cands.sort((a, b) => a[0] - b[0]);
  for (const [, x, y, z] of cands.slice(0, 6)) if (pointVisible(new THREE.Vector3(x + 0.5, y + 0.1, z + 0.5))) return [x, y, z];

/* ---------- Tap a tile: raycast against blocks and range tiles ---------- */
function cellFromTap(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([...chunkMeshes, rangeTiles], false);
  for (const h of hits) {
    if (h.object === rangeTiles) return rangeKeys[h.instanceId].split(',').map(Number);
    if (h.object.userData.chunk) {
      if (isGhosted(h.point)) continue;                       // see-through blocks don't catch taps
      if (!h.face || h.face.normal.y < 0.5) return null;      // only the top of a block counts
      const i = h.object.userData.cells[h.instanceId];
      return [i % W, ((i / WD) | 0) + 1, ((i / W) | 0) % D];

}

/* ---------- Commander sticks: each a fixed circle; drag inside to push ---------- */
function bindStick(el, out) {

    const r = el.getBoundingClientRect();

    const l = Math.hypot(dx, dy);

function stepCommander(dt) {
  const k = cmdKeys;
  const lx = lookStick.x + ((k.arrowright ? 1 : 0) - (k.arrowleft ? 1 : 0));
  const ly = lookStick.y + ((k.arrowup ? 1 : 0) - (k.arrowdown ? 1 : 0));
  cmd.yaw -= lx * 2.2 * dt;

  cancelPress();
  if (tap) {
    const { x, y } = tap;
    pressTimer = setTimeout(() => {          // held still long enough: try to select a unit there
      pressTimer = 0;
      if (!tap || commander) return;
      const k = unitAtScreen(x, y);
      if (k >= 0) {
        selectUnit(k);
        if (navigator.vibrate) navigator.vibrate(20);
      }
      tap = null;                            // a long press never counts as a tap
    }, LONG_PRESS);
  }
});
canvas.addEventListener('pointermove', e => {
  if (tap && e.pointerId === tap.id && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) { tap = null; cancelPress(); }
});
canvas.addEventListener('pointerup', e => {
  touches = Math.max(0, touches - 1);
  cancelPress();
  if (commander) { tap = null; return; }
  if (tap && e.pointerId === tap.id && performance.now() - tap.t < 300) {
    if (!$('unitsPanel').hidden || !$('buildPanel').hidden) { toggleUnits(false); toggleBuild(false); tap = null; return; }
    if (attackMode) tryAttack(e.clientX, e.clientY);
    else if (digMode) tryDig(e.clientX, e.clientY);
    else {
      let c = cellFromTap(e.clientX, e.clientY);
      if (!c || !range.has(cellKey(...c))) c = snapTile(e.clientX, e.clientY);
      if (c && range.has(cellKey(...c))) walkTo(c);
    }
  }
  tap = null;
});
canvas.addEventListener('pointercancel', () => { touches = Math.max(0, touches - 1); tap = null; cancelPress(); });

/* ---------- Ghost blocks: is anything between the camera and the selected unit? ---------- */
const ghostV = new THREE.Vector3(), bufSize = new THREE.Vector2();
let ghostOn = 0;
function updateGhost(dt) {
  let blocked = false;
  if (!fps && !commander) {
    const hx = walker.p.x, hy = walker.p.y + 0.6, hz = walker.p.z;
    const dx = camera.position.x - hx, dy = camera.position.y - hy, dz = camera.position.z - hz;
    const len = Math.hypot(dx, dy, dz);
    for (let t = 0.55; t < len; t += 0.2) {
      if (solidPoint(hx + dx / len * t, hy + dy / len * t, hz + dz / len * t)) { blocked = true; break; }
    }
  }
  ghostOn += ((blocked ? 1 : 0) - ghostOn) * (1 - Math.pow(0.002, dt));
  if (ghostOn < 0.01) { ghost.uCut.value = 0; return; }
  camera.updateMatrixWorld();
  renderer.getDrawingBufferSize(bufSize);
  ghostV.set(walker.p.x, walker.p.y + 0.6, walker.p.z).applyMatrix4(camera.matrixWorldInverse);
  const depth = -ghostV.z;
  ghostV.set(walker.p.x, walker.p.y + 0.6, walker.p.z).project(camera);
  ghost.uUnitPx.value.set((ghostV.x * 0.5 + 0.5) * bufSize.x, (ghostV.y * 0.5 + 0.5) * bufSize.y);
  const focal = bufSize.y / (2 * Math.tan(camera.fov * Math.PI / 360));
  ghost.uRadiusPx.value = Math.max(40, 2.4 * focal / Math.max(1, depth));
  ghost.uUnitDepth.value = depth;
  ghost.uCut.value = depth > 0 ? ghostOn : 0;
}

/* ---------- Loop ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let t0 = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  stepWalker(dt);
  updateCut();
  if (flashTimer && now > flashTimer) { flashTimer = 0; $('status').textContent = falling ? 'Collapsing…' : ''; }

  S.units.forEach((u, k) => {
    const g = unitGroups[k];
    if (!g) return;
    const v = g.userData.vis;
    if (k === sel) v.copy(walker.p);
    else v.lerp(tmpV.set(u.x + 0.5, u.y, u.z + 0.5), 1 - Math.pow(0.0005, dt));
    g.position.copy(v);
  });
  const sg = unitGroups[sel];
  let dy = walker.face - sg.rotation.y;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  sg.rotation.y += dy * (1 - Math.pow(0.0005, dt));
  selRing.position.set(walker.p.x, walker.p.y + 0.04, walker.p.z);

  updateFx(dt);
  animateLoot(now);

  const ox = Math.sin(yaw) * Math.cos(pitch), oy = Math.sin(pitch), oz = Math.cos(yaw) * Math.cos(pitch);
  if (commander || fps) ghost.uCut.value = 0;
  if (commander) {
    stepCommander(dt);
  } else if (fps) {
    // First person: eyes of the selected unit, looking along the swipe direction.
    camera.position.set(walker.p.x, walker.p.y + 0.85, walker.p.z);
    camera.lookAt(camera.position.x - ox, camera.position.y - oy, camera.position.z - oz);
    camTarget.copy(camera.position);
  } else {
    // Third person around the selected unit, always at the chosen distance. Blocks in the way turn see-through
    // (ghost blocks, below); the camera is only lifted if it would end up inside the ground.
    camTarget.lerp(tmpV.set(walker.p.x, walker.p.y + 0.9, walker.p.z), 1 - Math.pow(0.00005, dt));
    camDist = dist;
    camera.position.set(camTarget.x + ox * camDist, camTarget.y + oy * camDist, camTarget.z + oz * camDist);
    const X = Math.floor(camera.position.x), Z = Math.floor(camera.position.z);
    if (X >= 0 && X < W && Z >= 0 && Z < D) {
      let top = 0;
      for (let y = H - 1; y >= 0; y--) if (solidPoint(X + 0.5, y + 0.5, Z + 0.5)) { top = y + 1; break; }
      if (camera.position.y < top + 0.6) camera.position.y = top + 0.6;
    }
    camera.lookAt(camTarget);
  }
  updateGhost(dt);
  unitGroups.forEach((g, k) => {
    const u = S.units[k];
    if (!u) return;
    const cx = k === sel ? Math.floor(walker.p.x) : u.x, cy = k === sel ? Math.floor(walker.p.y + 1e-4) : u.y, cz = k === sel ? Math.floor(walker.p.z) : u.z;
    g.userData.sprite.visible = !(fps && !commander && k === sel) && !hiddenCell(cx, cy, cz);
  });
  selRing.visible = !fps && !commander;
  const targets = attackMode ? attackTargets() : [];
  unitGroups.forEach((g, k) => {
    if (k >= S.units.length) return;
    const camAng = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    g.userData.sprite.rotation.y = camAng - g.rotation.y;
    g.userData.hpBar.rotation.y = camAng - g.rotation.y;
    g.userData.hpBar.visible = g.userData.sprite.visible;
    const ring = atkRing(k);
    ring.visible = targets.includes(k) && g.userData.sprite.visible;
    if (ring.visible) ring.position.set(g.position.x, g.position.y + 0.05, g.position.z);
  });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resetWalker();
camTarget.set(walker.p.x, walker.p.y + 0.9, walker.p.z);
rebuildAll();
showRange();
refreshHud();
requestAnimationFrame(frame);
})();
</script>
</body>
